
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VICKY FLIX ADMIN</title>
<style>
body{margin:0;background:#090909;color:white;font-family:Arial;text-align:center}
header{background:#e50914;padding:20px;font-size:25px;font-weight:bold}
main{padding:20px}
button{background:#e50914;color:white;border:0;padding:13px 25px;border-radius:6px;font-size:16px;margin:10px}
#panel{display:none}
.card{background:#202020;padding:15px;margin:12px;border-radius:10px}
</style>
</head>
<body>
<header>VICKY FLIX ADMIN</header>
<main>
<h2>Admin Login</h2>
<button id="login">Login with Google</button>
<button id="logout" style="display:none">Logout</button>
<div id="panel">
<h2>Dashboard</h2>
<p id="status">Loading...</p>
<div id="movies"></div>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const API="https://vicky-flix-server-1-ekbq.onrender.com";

const firebaseConfig={
apiKey:"AIzaSyC1HbL9ykfiuvxA-XhyepvGtIor6-QzRiU",
authDomain:"vicky-flix.firebaseapp.com",
projectId:"vicky-flix",
storageBucket:"vicky-flix.firebasestorage.app",
messagingSenderId:"621388744063",
appId:"1:621388744063:web:7171914a196008374f064a"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();

document.getElementById("login").onclick=()=>{
const provider=new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider).catch(e=>alert(e.message));
};

document.getElementById("logout").onclick=()=>auth.signOut();

auth.onAuthStateChanged(async user=>{
if(user){
document.getElementById("login").style.display="none";
document.getElementById("logout").style.display="inline-block";
document.getElementById("panel").style.display="block";
loadMovies(user);
}else{
document.getElementById("login").style.display="inline-block";
document.getElementById("logout").style.display="none";
document.getElementById("panel").style.display="none";
}
});

async function loadMovies(user){
try{
const token=await user.getIdToken();
const res=await fetch(API+"/api/videos",{
headers:{Authorization:"Bearer "+token}
});
if(!res.ok) throw new Error("Backend error: "+res.status);
const data=await res.json();
document.getElementById("status").innerText="Total Movies: "+data.length;
document.getElementById("movies").innerHTML=data.map(m=>
`<div class="card">${m.title||"Untitled Movie"}</div>`
).join("");
}catch(e){
document.getElementById("status").innerText=e.message;
}
}
</script>
</body>
</html>
